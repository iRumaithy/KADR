          MADAR_HELPERS
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require the exact reviewed commit
        run: node scripts/madar-auto.mjs check
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
      - name: Verify version routing and backend before publication
        run: node scripts/madar-auto.mjs preflight
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
      - name: Prepare the same approved files
        run: node scripts/prepare-madar-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Recheck approval immediately before Pages
        run: node scripts/madar-auto.mjs check
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
      - name: Deploy approved files
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Pages serves the exact approved commit
        run: node scripts/verify-madar-deployment.mjs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Activate release for KADR users and record publication
        run: node scripts/madar-auto.mjs complete
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
