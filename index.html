<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كادر">
<link rel="manifest" href="/KADR/manifest.webmanifest">
<link rel="apple-touch-icon" href="/KADR/apple-touch-icon.png">
<title>كادر — KADR</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#122b48 0,#071426 36%,#030811 76%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#f4f6fa}.loader{width:min(88vw,430px);padding:32px 24px;border:1px solid rgba(214,178,74,.28);border-radius:32px;background:linear-gradient(145deg,rgba(17,41,68,.9),rgba(4,14,27,.94));box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center}.mark{width:84px;height:84px;margin:auto;border-radius:24px;display:grid;place-items:center;font:800 44px Georgia,serif;color:#071426;background:linear-gradient(135deg,#ffe37b,#c89a26);box-shadow:0 10px 34px rgba(214,178,74,.23)}h1{margin:18px 0 5px;font-size:27px}p{margin:0;color:#aeb8c8;font-size:14px}.bar{height:4px;margin:24px 0 0;border-radius:99px;background:#102844;overflow:hidden}.bar:before{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#9da7b7,#f4cf57,#fff0a5);animation:run 1.05s ease-in-out infinite}@keyframes run{0%{transform:translateX(150%)}100%{transform:translateX(-240%)}}.err{display:none;margin-top:16px;color:#f1cd63}.err.show{display:block}
</style>
<script src="/KADR/config.js"></script>
</head>
<body>
<div class="loader"><div class="mark">K</div><h1>كادر</h1><p id="status">جارٍ فتح النسخة المعتمدة…</p><div class="bar"></div><div class="err" id="err">تعذر التحقق من الإصدار. سنحاول فتح آخر نسخة معروفة.</div></div>
<script>
(()=>{
  const FALLBACK='1.13', STABLE_KEY='kadrBootstrapStableVersion', BOOT='v3';
  const q=new URLSearchParams(location.search);
  const cfg=window.APP_CONFIG||{};
  const APP_ROOT=new URL('/KADR/',document.baseURI).href;
  const base=APP_ROOT+'releases/v';
  const allowedKeys=['share','u','work','candidateTest','candidateVersion'];
  const cleanVersion=v=>/^\d+(\.\d+){1,2}$/.test(String(v||''))?String(v):'';
  const go=(version,candidate=false)=>{
    version=cleanVersion(version)||localStorage.getItem(STABLE_KEY)||FALLBACK;
    const out=new URLSearchParams();
    for(const k of allowedKeys) if(q.has(k)) out.set(k,q.get(k));
    const injected=String(window.__KADR_SHARE_SLUG__||'').trim();
    if(injected) out.set('share',injected);
    if(candidate){out.set('candidateTest','1');out.set('candidateVersion',version)}
    else {out.delete('candidateTest');out.delete('candidateVersion')}
    const target=`${base}${encodeURIComponent(version)}/`+(out.toString()?`?${out}`:'');
    location.replace(target);
  };
  const fail=()=>{document.getElementById('err')?.classList.add('show');setTimeout(()=>go(localStorage.getItem(STABLE_KEY)||FALLBACK,false),350)};
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_PUBLISHABLE_KEY)return fail();
  fetch(`${cfg.SUPABASE_URL}/rest/v1/mashhad_app_release?id=eq.main&select=stable_version,candidate_version,candidate_available,candidate_status,candidate_path`,{
    cache:'no-store',headers:{apikey:cfg.SUPABASE_PUBLISHABLE_KEY}
  }).then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()}).then(rows=>{
    const rel=rows?.[0]||{}, stable=cleanVersion(rel.stable_version)||FALLBACK;
    localStorage.setItem(STABLE_KEY,stable);
    const wantsCandidate=q.get('candidateTest')==='1';
    const cv=cleanVersion(rel.candidate_version);
    const candidateReady=wantsCandidate&&rel.candidate_available===true&&rel.candidate_status==='testing'&&rel.candidate_path==='release'&&cv;
    go(candidateReady?cv:stable,!!candidateReady);
  }).catch(fail);
  if('serviceWorker' in navigator&&location.protocol==='https:'&&location.origin===new URL(APP_ROOT).origin)navigator.serviceWorker.register(APP_ROOT+'sw.js',{scope:'/KADR/'}).then(r=>r.update()).catch(()=>{});
})();
</script>
</body>
</html>
